<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador de Matrices - Desafío Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-955 text-gray-200 min-h-screen font-sans" style="background-color: #0b0f19;">

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <header class="mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold text-white">
                Procesador de Matrices
            </h1>
            <p class="text-xs text-gray-500 mt-1">Orquestador Go & API Node.js</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <div class="lg:col-span-1 space-y-6">

                <div class="bg-gray-900/60 p-5 rounded border border-gray-800">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400">Login con JWT</h2>
                        <span id="authState" class="text-xxs font-bold px-2 py-0.5 rounded bg-red-950/40 text-red-500 border border-red-900/50">Bloqueado</span>
                    </div>

                    <div id="loginForm" class="space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="authUsername" class="bg-gray-950 border border-gray-800 rounded p-1.5 text-xs text-white focus:outline-none focus:border-gray-700" placeholder="Usuario" />
                            <input type="password" id="authPassword" class="bg-gray-950 border border-gray-800 rounded p-1.5 text-xs text-white focus:outline-none focus:border-gray-700" placeholder="Contraseña" />
                        </div>
                        <button onclick="login()" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-1.5 rounded text-xs transition duration-200">
                            Iniciar Sesión
                        </button>
                    </div>

                    <div id="logoutForm" class="hidden">
                        <p class="text-xs text-gray-400 mb-2">Sesión activa como <span id="currentUser" class="font-bold text-white"></span></p>
                        <button onclick="logout()" class="w-full bg-red-950/40 hover:bg-red-900/40 text-red-400 border border-red-900/50 font-bold py-1.5 rounded text-xs transition duration-200">
                            Cerrar Sesión
                        </button>
                    </div>
                </div>

                <div class="bg-gray-900/60 p-5 rounded border border-gray-800">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-4">1. Configuración</h2>

                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-gray-500 mb-2">Predefinidos</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="loadPreset('qr')" class="bg-gray-800 hover:bg-gray-700 text-xs py-1.5 px-3 rounded font-medium transition">
                                Caso QR (3x3)
                            </button>
                            <button onclick="loadPreset('rect')" class="bg-gray-800 hover:bg-gray-700 text-xs py-1.5 px-3 rounded font-medium transition">
                                Rectangular (2x3)
                            </button>
                        </div>
                    </div>

                    <div class="flex border-b border-gray-800 mb-4">
                        <button onclick="setTab('grid')" id="tabBtn-grid" class="flex-1 py-1.5 text-xs font-bold border-b-2 border-white text-white transition focus:outline-none">
                            Grilla
                        </button>
                        <button onclick="setTab('json')" id="tabBtn-json" class="flex-1 py-1.5 text-xs font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-300 transition focus:outline-none">
                            JSON
                        </button>
                    </div>

                    <div class="space-y-4">
                        <div id="mode-grid" class="space-y-4">
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Filas (M)</label>
                                    <select id="gridRows" onchange="buildGridFromDimensions()" class="w-full bg-gray-950 border border-gray-800 rounded p-1.5 text-xs text-white focus:outline-none">
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3" selected>3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs text-gray-500 mb-1">Columnas (N)</label>
                                    <select id="gridCols" onchange="buildGridFromDimensions()" class="w-full bg-gray-950 border border-gray-800 rounded p-1.5 text-xs text-white focus:outline-none">
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3" selected>3</option>
                                        <option value="4">4</option>
                                        <option value="5">5</option>
                                        <option value="6">6</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <div id="gridContainer" class="bg-gray-955 p-3 rounded border border-gray-800 overflow-x-auto">
                                </div>
                            </div>
                        </div>

                        <div id="mode-json" class="hidden">
                            <textarea id="matrixJson" rows="6" class="w-full bg-gray-950 text-mono text-xs p-3 border border-gray-800 rounded focus:outline-none text-gray-300">[[12, -51, 4], [6, 167, -68], [-4, 24, -41]]</textarea>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="submitAction('rotate')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded text-xs transition duration-200">
                                Rotar 90°
                            </button>
                            <button onclick="submitAction('qr')" class="flex-1 bg-white hover:bg-gray-200 text-black font-bold py-2 px-3 rounded text-xs transition duration-200">
                                Descomponer QR
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">

                <div id="loader" class="hidden flex items-center justify-center py-12 bg-gray-900 rounded border border-gray-800">
                    <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-white"></div>
                </div>

                <div id="errorBox" class="hidden bg-gray-900 border border-red-950 text-red-400 p-4 rounded text-xs">
                    <p class="font-bold">Error en el procesamiento</p>
                    <p id="errorMessage" class="mt-1"></p>
                </div>

                <div id="results" class="hidden space-y-6">

                    <div class="bg-gray-900/60 p-5 rounded border border-gray-800">
                        <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400 mb-4" id="resultTitle">Resultado</h3>
                        <div id="matricesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        </div>
                    </div>

                    <div class="bg-gray-900/60 p-5 rounded border border-gray-800">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-sm font-bold uppercase tracking-wider text-gray-400">Estadísticas</h3>
                            <span id="diagonalBadge" class="px-2 py-0.5 rounded text-xxs font-semibold"></span>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                            <div class="bg-gray-950 p-3 rounded border border-gray-800 text-center">
                                <span class="block text-xxs text-gray-500 uppercase font-bold">Máximo</span>
                                <span id="statMax" class="text-lg font-bold text-white">-</span>
                            </div>
                            <div class="bg-gray-955 p-3 rounded border border-gray-800 text-center">
                                <span class="block text-xxs text-gray-500 uppercase font-bold">Mínimo</span>
                                <span id="statMin" class="text-lg font-bold text-white">-</span>
                            </div>
                            <div class="bg-gray-955 p-3 rounded border border-gray-800 text-center">
                                <span class="block text-xxs text-gray-500 uppercase font-bold font-bold font-bold">Promedio</span>
                                <span id="statAvg" class="text-lg font-bold text-white">-</span>
                            </div>
                            <div class="bg-gray-955 p-3 rounded border border-gray-800 text-center">
                                <span class="block text-xxs text-gray-500 uppercase font-bold">Suma Total</span>
                                <span id="statSum" class="text-lg font-bold text-white">-</span>
                            </div>
                        </div>

                        <div id="verificationAlert" class="mt-4 p-3 rounded text-xs text-center font-medium hidden">
                        </div>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <script>
        const API_BASE = '__API_BASE_URL__';

        const PRESETS = {
            qr: [[12, -51, 4], [6, 167, -68], [-4, 24, -41]],
            rect: [[1, 2, 3], [4, 5, 6]]
        };

        let currentTab = 'grid';
        let jwtToken = localStorage.getItem('jwtToken') || '';
        let loggedUser = localStorage.getItem('loggedUser') || '';

        function updateAuthUI() {
            const state = document.getElementById('authState');
            const loginForm = document.getElementById('loginForm');
            const logoutForm = document.getElementById('logoutForm');
            const currentUser = document.getElementById('currentUser');

            if (jwtToken) {
                state.className = "text-xxs font-bold px-2 py-0.5 rounded bg-green-950/40 text-green-500 border border-green-900/50";
                state.innerText = "Autorizado";
                loginForm.classList.add('hidden');
                logoutForm.classList.remove('hidden');
                currentUser.innerText = loggedUser;
            } else {
                state.className = "text-xxs font-bold px-2 py-0.5 rounded bg-red-950/40 text-red-500 border border-red-900/50";
                state.innerText = "Bloqueado";
                loginForm.classList.remove('hidden');
                logoutForm.classList.add('hidden');
            }
        }

        async function login() {
            const u = document.getElementById('authUsername').value;
            const p = document.getElementById('authPassword').value;
            const errorBox = document.getElementById('errorBox');
            const errorMessage = document.getElementById('errorMessage');

            errorBox.classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Credenciales incorrectas");
                }

                jwtToken = data.token;
                loggedUser = u;
                localStorage.setItem('jwtToken', jwtToken);
                localStorage.setItem('loggedUser', loggedUser);
                updateAuthUI();
            } catch (err) {
                errorBox.classList.remove('hidden');
                errorMessage.innerText = "Error de autenticación: " + err.message;
            }
        }

        function logout() {
            jwtToken = '';
            loggedUser = '';
            localStorage.removeItem('jwtToken');
            localStorage.removeItem('loggedUser');
            updateAuthUI();
        }

        function setTab(tab) {
            currentTab = tab;
            const btnGrid = document.getElementById('tabBtn-grid');
            const btnJson = document.getElementById('tabBtn-json');
            const modeGrid = document.getElementById('mode-grid');
            const modeJson = document.getElementById('mode-json');

            if (tab === 'grid') {
                btnGrid.className = "flex-1 py-1.5 text-xs font-bold border-b-2 border-white text-white transition focus:outline-none";
                btnJson.className = "flex-1 py-1.5 text-xs font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-300 transition focus:outline-none";
                modeGrid.classList.remove('hidden');
                modeJson.classList.add('hidden');
                syncGridFromJSON();
            } else {
                btnGrid.className = "flex-1 py-1.5 text-xs font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-300 transition focus:outline-none";
                btnJson.className = "flex-1 py-1.5 text-xs font-bold border-b-2 border-white text-white transition focus:outline-none";
                modeGrid.classList.add('hidden');
                modeJson.classList.remove('hidden');
                syncJSONFromGrid();
            }
        }

        function buildGridFromDimensions() {
            const rows = parseInt(document.getElementById('gridRows').value);
            const cols = parseInt(document.getElementById('gridCols').value);
            const container = document.getElementById('gridContainer');

            let html = `<div class="grid gap-1.5" style="grid-template-columns: repeat(${cols}, minmax(50px, 1fr));">`;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    html += `<input type="number" step="any" id="cell-${r}-${c}" value="0" class="w-full bg-gray-900 border border-gray-800 rounded p-1 text-center font-mono text-xs text-white focus:outline-none focus:border-gray-600" />`;
                }
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        function syncGridFromJSON() {
            try {
                const matrix = JSON.parse(document.getElementById('matrixJson').value);
                if (Array.isArray(matrix) && matrix.length > 0 && Array.isArray(matrix[0])) {
                    const rows = matrix.length;
                    const cols = matrix[0].length;

                    document.getElementById('gridRows').value = rows;
                    document.getElementById('gridCols').value = cols;
                    buildGridFromDimensions();

                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const val = matrix[r][c] !== undefined ? matrix[r][c] : 0;
                            const input = document.getElementById(`cell-${r}-${c}`);
                            if (input) input.value = val;
                        }
                    }
                }
            } catch (e) {}
        }

        function syncJSONFromGrid() {
            const matrix = getMatrixFromGrid();
            if (matrix) {
                document.getElementById('matrixJson').value = JSON.stringify(matrix);
            }
        }

        function getMatrixFromGrid() {
            const rows = parseInt(document.getElementById('gridRows').value);
            const cols = parseInt(document.getElementById('gridCols').value);
            const matrix = [];

            for (let r = 0; r < rows; r++) {
                const row = [];
                for (let c = 0; c < cols; c++) {
                    const input = document.getElementById(`cell-${r}-${c}`);
                    const val = input ? parseFloat(input.value) : 0;
                    row.push(isNaN(val) ? 0 : val);
                }
                matrix.push(row);
            }
            return matrix;
        }

        function loadPreset(type) {
            const matrix = PRESETS[type];
            document.getElementById('matrixJson').value = JSON.stringify(matrix);
            if (currentTab === 'grid') {
                syncGridFromJSON();
            } else {
                syncJSONFromGrid();
            }
        }

        function renderMatrixHTML(title, matrix) {
            let html = `<div class="bg-gray-955 p-4 rounded border border-gray-800">
                <span class="block text-xs text-gray-500 font-bold mb-2">${title}</span>
                <div class="overflow-x-auto">
                    <table class="w-full text-center border-collapse">`;

            matrix.forEach(row => {
                html += `<tr>`;
                row.forEach(val => {
                    const formatted = Number(val).toFixed(4).replace(/\.?0+$/, '');
                    html += `<td class="border border-gray-900 p-1.5 font-mono text-xs">${formatted}</td>`;
                });
                html += `</tr>`;
            });

            html += `</table></div></div>`;
            return html;
        }

        async function submitAction(endpoint) {
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const errorBox = document.getElementById('errorBox');

            loader.classList.remove('hidden');
            results.classList.add('hidden');
            errorBox.classList.add('hidden');

            let parsedMatrix;
            if (currentTab === 'grid') {
                parsedMatrix = getMatrixFromGrid();
            } else {
                const matrixJsonText = document.getElementById('matrixJson').value;
                try {
                    parsedMatrix = JSON.parse(matrixJsonText);
                } catch (err) {
                    loader.classList.add('hidden');
                    errorBox.classList.remove('hidden');
                    document.getElementById('errorMessage').innerText = "Formato JSON inválido: " + err.message;
                    return;
                }
            }

            if (!Array.isArray(parsedMatrix) || parsedMatrix.length === 0 || parsedMatrix.some(r => !Array.isArray(r))) {
                loader.classList.add('hidden');
                errorBox.classList.remove('hidden');
                document.getElementById('errorMessage').innerText = "El input debe ser un array de arrays [][]number.";
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/matrix/${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': jwtToken ? `Bearer ${jwtToken}` : ''
                    },
                    body: JSON.stringify({ matrix: parsedMatrix })
                });

                const data = await response.json();
                loader.classList.add('hidden');

                if (!response.ok) {
                    throw new Error(data.error || "Ocurrió un error en el servidor");
                }

                results.classList.remove('hidden');

                const container = document.getElementById('matricesContainer');
                container.innerHTML = '';

                const verificationAlert = document.getElementById('verificationAlert');
                verificationAlert.classList.add('hidden');

                if (endpoint === 'rotate') {
                    document.getElementById('resultTitle').innerText = "Matriz Rotada (90°)";
                    container.innerHTML = renderMatrixHTML('Matriz Rotada', data.rotated_matrix);
                } else {
                    document.getElementById('resultTitle').innerText = "Descomposición QR";
                    container.innerHTML += renderMatrixHTML('Matriz Q (Ortogonal)', data.q_matrix);
                    container.innerHTML += renderMatrixHTML('Matriz R (Triangular)', data.r_matrix);

                    verificationAlert.classList.remove('hidden');
                    if (data.mathematically_verified) {
                        verificationAlert.className = "mt-4 p-3 rounded text-xs text-center font-medium bg-gray-900 border border-green-900 text-green-400";
                        verificationAlert.innerText = "✓ Verificación matemática exitosa: Q * R = A y Q^T * Q = I con margen menor a 1e-7";
                    } else {
                        verificationAlert.className = "mt-4 p-3 rounded text-xs text-center font-medium bg-gray-900 border border-red-900 text-red-400";
                        verificationAlert.innerText = "✗ La validación matemática de precisión falló.";
                    }
                }

                const stats = data.statistics;
                document.getElementById('statMax').innerText = stats.max.toFixed(4).replace(/\.?0+$/, '');
                document.getElementById('statMin').innerText = stats.min.toFixed(4).replace(/\.?0+$/, '');
                document.getElementById('statAvg').innerText = stats.average.toFixed(4).replace(/\.?0+$/, '');
                document.getElementById('statSum').innerText = stats.sum_total.toFixed(4).replace(/\.?0+$/, '');

                const badge = document.getElementById('diagonalBadge');
                if (stats.is_diagonal) {
                    badge.className = "px-2 py-0.5 rounded text-xxs font-semibold bg-gray-900 border border-green-900 text-green-400";
                    badge.innerText = "Alguna es Diagonal";
                } else {
                    badge.className = "px-2.5 py-0.5 rounded text-xxs font-semibold bg-gray-900 border border-gray-800 text-gray-500";
                    badge.innerText = "Ninguna es Diagonal";
                }

            } catch (err) {
                loader.classList.add('hidden');
                errorBox.classList.remove('hidden');
                document.getElementById('errorMessage').innerText = err.message;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            syncGridFromJSON();
            updateAuthUI();
        });
    </script>
</body>
</html>
